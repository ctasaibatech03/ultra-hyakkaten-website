<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>管理画面ログイン | ウルトラ百貨店</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --color-bg: #FAF7F2;
    --color-surface: #FFFFFF;
    --color-text: #2B2825;
    --color-text-sub: #5C574F;
    --color-accent: #A6824F;
    --color-accent-dark: #7C5E38;
    --color-border: #E4DDD0;
    --font-heading: "Noto Serif JP", serif;
    --font-body: "Noto Sans JP", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    font-family: var(--font-body);
    color: var(--color-text);
    background: var(--color-bg);
  }
  .card {
    width: 100%;
    max-width: 360px;
    padding: 32px;
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: 6px;
  }
  h1 {
    margin: 0 0 24px;
    font-family: var(--font-heading);
    font-size: 20px;
    text-align: center;
  }
  label {
    display: block;
    margin-bottom: 6px;
    font-size: 14px;
    color: var(--color-text-sub);
  }
  input {
    width: 100%;
    margin-bottom: 18px;
    padding: 10px 12px;
    font-family: var(--font-body);
    font-size: 15px;
    border: 1px solid var(--color-border);
    border-radius: 4px;
    background: var(--color-surface);
    color: var(--color-text);
  }
  input:focus { outline: none; border-color: var(--color-accent); }
  button {
    width: 100%;
    padding: 10px;
    font-family: var(--font-body);
    font-size: 15px;
    border: none;
    border-radius: 4px;
    background: var(--color-accent);
    color: #fff;
    cursor: pointer;
  }
  button:hover { background: var(--color-accent-dark); }
  button:disabled { opacity: 0.6; cursor: default; }
  .error-msg {
    color: #A33B3B;
    background: #FBEAEA;
    border: 1px solid #E5B4B4;
    border-radius: 4px;
    padding: 10px 14px;
    margin: 0 0 16px;
    font-size: 14px;
  }
</style>
</head>
<body>

<form class="card" id="login-form">
  <h1>管理画面ログイン</h1>
  <p class="error-msg" id="error-msg" hidden></p>
  <label for="id">ID</label>
  <input type="text" id="id" name="id" autocomplete="username" required autofocus>
  <label for="password">パスワード</label>
  <input type="password" id="password" name="password" autocomplete="current-password" required>
  <button type="submit" id="submit">ログイン</button>
</form>

<script>
  const form = document.getElementById('login-form');
  const errorMsg = document.getElementById('error-msg');
  const submit = document.getElementById('submit');
  const idInput = document.getElementById('id');
  const passwordInput = document.getElementById('password');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.hidden = true;
    submit.disabled = true;

    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          id: idInput.value.trim(),
          password: passwordInput.value
        })
      });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.message || 'ログインに失敗しました');
      }
      location.href = '/admin';
    } catch (err) {
      errorMsg.textContent = err.message || 'ログインに失敗しました';
      errorMsg.hidden = false;
      passwordInput.value = '';
      submit.disabled = false;
    }
  });
</script>

</body>
</html>
